services:
  # NGINX API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: chat-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - channel-service
      - chat-service
      - frontend
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: chat-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    networks:
      - chat-net

  auth-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile.auth
    container_name: chat-auth
    environment:
      - AUTH_PORT=8080
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - PG_SSLMODE=disable
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
    depends_on:
      - postgres
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "8080"

  channel-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile.channel
    container_name: chat-channel
    environment:
      - CHANNEL_PORT=8081
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - PG_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "8081"

  chat-service:
    build:
      context: ./backend
    container_name: chat-nodejs
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chat
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
      - SERVER_BASE_URL=http://localhost
    volumes:
      - media_volume:/app/media
    depends_on:
      - mongodb
      - redis
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
    container_name: chat-frontend
    environment:
      - VITE_AUTH_URL=http://localhost/api/auth
      - VITE_CHANNEL_URL=http://localhost/api/channels
      - VITE_SERVER_URL=http://localhost/api/chat
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - channel-service
      - chat-service
    networks:
      - chat-net
    expose:
      - "5173"

networks:
  chat-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  media_volume:
