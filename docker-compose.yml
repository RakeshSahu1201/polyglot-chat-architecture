services:
  # NGINX API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: chat-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      channel-service:
        condition: service_started
      nodejs:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    container_name: chat-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    networks:
      - chat-net

  auth-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile.auth
    container_name: chat-auth
    environment:
      - AUTH_PORT=8080
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - PG_SSLMODE=disable
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "8080"

  channel-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile.channel
    container_name: chat-channel
    environment:
      - CHANNEL_PORT=8081
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - PG_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
      - MEDIA_SERVICE_URL=http://nodejs:5000
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "8081"

  worker-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile.worker
    container_name: chat-worker
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - PG_SSLMODE=disable
      - MONGO_URI=mongodb://mongodb:27017/chat
      - MONGO_DB=chat
      - IPFS_API_URL=http://ipfs:5001
      - WORKER_MESSAGE_TTL_HOURS=24
      - WORKER_MESSAGE_SWEEP_MINUTES=10
      - WORKER_CHANNEL_INACTIVE_HOURS=720
      - WORKER_CHANNEL_SWEEP_MINUTES=60
      - WORKER_MEDIA_SWEEP_MINUTES=30
      - WORKER_MEDIA_GRACE_HOURS=1
    depends_on:
      - postgres
      - mongodb
      - ipfs
    networks:
      - chat-net
    restart: unless-stopped

  nodejs:
    build:
      context: ./backend
    container_name: chat-nodejs
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chat
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=chatuser
      - PG_PASSWORD=chatpass
      - PG_DB=chatdb
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_123
      - CORS_ORIGIN=http://localhost
      - SERVER_BASE_URL=http://localhost
      - IPFS_API_URL=http://ipfs:5001
      - IPFS_GATEWAY_BASE_URL=http://localhost/ipfs
    depends_on:
      - mongodb
      - redis
      - ipfs
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "5000"

  ipfs:
    image: ipfs/kubo:latest
    container_name: chat-ipfs
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "5001"
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost/api
        VITE_IPFS_GATEWAY_URL: http://localhost/ipfs
    container_name: chat-frontend
    depends_on:
      - auth-service
      - channel-service
      - nodejs
    networks:
      - chat-net
    restart: unless-stopped
    expose:
      - "80"

networks:
  chat-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
