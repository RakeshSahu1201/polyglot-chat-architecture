name: 🚀 Deploy — Production

# ────────────────────────────────────────────────────────────────────────────
# Triggers
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main     # auto-deploy on every push to this branch
  workflow_dispatch:      # allow manual trigger from GitHub UI

# Cancel in-progress runs on the same branch to avoid race conditions
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────────────────
# Environment
# ────────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_ENV: prod
  COMPOSE_FILE: docker-compose.prod.yml
  APP_DIR: /opt/polyglot-chat

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build and Push Images
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker images
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VITE_AUTH_URL: ${{ secrets.PROD_SERVER_BASE_URL }}/api/auth
          VITE_CHANNEL_URL: ${{ secrets.PROD_SERVER_BASE_URL }}/api/channels
          VITE_SERVER_URL: ${{ secrets.PROD_SERVER_BASE_URL }}/api/chat
          VITE_IPFS_GATEWAY_URL: ${{ secrets.PREPROD_VITE_IPFS_GATEWAY_URL }}
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} build
          docker compose -f ${{ env.COMPOSE_FILE }} push

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Integration Tests (True CI)
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 🧪 Run E2E & API Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Test Dependencies
        run: |
          cd tests
          npm install
          npx playwright install --with-deps chromium

      - name: Start Ephemeral Docker Compose Stack
        # We use the local dev docker-compose.yml because it spins up 
        # local Postgres, Redis, and MongoDB, completely isolating the tests from Production!
        env:
          VITE_API_URL: http://localhost/api
          CORS_ORIGIN: http://localhost
          SERVER_BASE_URL: http://localhost
          JWT_SECRET: "test-secret-key"
          POSTGRES_USER: "chatuser"
          POSTGRES_PASSWORD: "chatpass"
        run: |
          docker compose -f docker-compose.yml up -d
          
          echo "⏳ Waiting 30 seconds for all services and databases to initialize..."
          sleep 30
          
          # Health check local gateway
          curl -s http://localhost/health || echo "Gateway not ready yet"

      - name: Run API Tests (Jest + Supertest)
        run: |
          cd tests
          npx jest api/

      - name: Run UI Tests (Playwright)
        run: |
          cd tests
          npx playwright test

      - name: Cleanup Test Data (Teardown)
        if: always()
        run: |
          echo "🧹 Tearing down ephemeral test environment and wiping data volumes..."
          docker compose -f docker-compose.yml down -v
          docker image prune -af

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy — Transfer configs and pull images on server
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Prod Server
    runs-on: ubuntu-latest
    needs: [build-and-push, integration-tests]
    environment: prod

    steps:
      - name: Checkout code (for config files)
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "Scanning host: ${{ secrets.PROD_SERVER_HOST }} on port ${{ secrets.PROD_SERVER_PORT || '22' }}"
          ssh-keyscan -T 10 -p ${{ secrets.PROD_SERVER_PORT || '22' }} -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts 2>&1 && echo "✅ Host key fetched" || echo "❌ ssh-keyscan failed — check if port is open on the server"
          cat ~/.ssh/known_hosts

      - name: Copy config files to server
        run: |
          # Create directories and transfer the minimal files needed to run docker compose
          ssh -p ${{ secrets.PROD_SERVER_PORT || '22' }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} "mkdir -p ${{ env.APP_DIR }}/nginx"
          scp -P ${{ secrets.PROD_SERVER_PORT || '22' }} ${{ env.COMPOSE_FILE }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:${{ env.APP_DIR }}/
          scp -P ${{ secrets.PROD_SERVER_PORT || '22' }} nginx/nginx.prod.conf ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:${{ env.APP_DIR }}/nginx/

      - name: Write .env.prod on server
        run: |
          ssh -p ${{ secrets.PROD_SERVER_PORT || '22' }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} "cat > ${{ env.APP_DIR }}/.env.prod" << 'EOF'
          NODE_ENV=prod
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          CORS_ORIGIN=${{ secrets.PROD_CORS_ORIGIN }}
          SERVER_BASE_URL=${{ secrets.PROD_SERVER_BASE_URL }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          
          # Supabase PostgreSQL
          SUPABASE_HOST=${{ secrets.PREPROD_SUPABASE_HOST }}
          SUPABASE_PORT=${{ secrets.PREPROD_SUPABASE_PORT }}
          SUPABASE_USER=${{ secrets.PREPROD_SUPABASE_USER }}
          SUPABASE_PASSWORD=${{ secrets.PREPROD_SUPABASE_PASSWORD }}
          SUPABASE_DB=${{ secrets.PREPROD_SUPABASE_DB }}
          
          # MongoDB Atlas
          MONGODB_ATLAS_URI=${{ secrets.PREPROD_MONGODB_ATLAS_URI }}
          
          # Pinata IPFS
          PINATA_JWT=${{ secrets.PREPROD_PINATA_JWT }}
          PINATA_API_URL=https://api.pinata.cloud
          IPFS_GATEWAY_BASE_URL=${{ secrets.PREPROD_VITE_IPFS_GATEWAY_URL }}
          EOF

      - name: Pull images & restart services
        run: |
          ssh -p ${{ secrets.PROD_SERVER_PORT || '22' }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << ENDSSH
          set -e
          cd ${{ env.APP_DIR }}
          
          echo "🔑 Authenticating server with Docker Hub..."
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          echo "📥 Pulling images..."
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file .env.prod pull
          
          echo "🚀 Bringing services up..."
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file .env.prod up -d --remove-orphans
          
          echo "🔄 Reloading NGINX..."
          docker compose -f ${{ env.COMPOSE_FILE }} exec -T api-gateway nginx -s reload || true
          
          echo "🧹 Cleaning up dangling images..."
          docker image prune -f
          
          echo "✅ Deployment complete!"
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting 20 s for services to initialise..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PROD_SERVER_BASE_URL }}/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (got $STATUS)"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment FAILED for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
