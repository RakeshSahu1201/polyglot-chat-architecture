name: 🚀 Deploy — Pre-Production

# ────────────────────────────────────────────────────────────────────────────
# Triggers
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - master     # auto-deploy on every push to this branch
  workflow_dispatch:      # allow manual trigger from GitHub UI

# Cancel in-progress runs on the same branch to avoid race conditions
concurrency:
  group: deploy-preprod-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────────────────
# Environment
# ────────────────────────────────────────────────────────────────────────────
env:
  DEPLOY_ENV: preprod
  COMPOSE_FILE: docker-compose.preprod.yml
  APP_DIR: /opt/polyglot-chat

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build and Push Images
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    environment: preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker images
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VITE_AUTH_URL: ${{ secrets.PREPROD_VITE_AUTH_URL }}
          VITE_CHANNEL_URL: ${{ secrets.PREPROD_VITE_CHANNEL_URL }}
          VITE_SERVER_URL: ${{ secrets.PREPROD_VITE_SERVER_URL }}
          VITE_IPFS_GATEWAY_URL: ${{ secrets.PREPROD_VITE_IPFS_GATEWAY_URL }}
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} build
          docker compose -f ${{ env.COMPOSE_FILE }} push

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy — Transfer configs and pull images on server
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Pre-Prod Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: preprod

    steps:
      - name: Checkout code (for config files)
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "Scanning host: ${{ secrets.PREPROD_SERVER_HOST }} on port ${{ secrets.PREPROD_SERVER_PORT || '22' }}"
          ssh-keyscan -T 10 -p ${{ secrets.PREPROD_SERVER_PORT || '22' }} -H ${{ secrets.PREPROD_SERVER_HOST }} >> ~/.ssh/known_hosts 2>&1 && echo "✅ Host key fetched" || echo "❌ ssh-keyscan failed — check if port is open on the server"
          cat ~/.ssh/known_hosts

      - name: Copy config files to server
        run: |
          # Create directories and transfer the minimal files needed to run docker compose
          ssh -p ${{ secrets.PREPROD_SERVER_PORT || '22' }} ${{ secrets.PREPROD_SERVER_USER }}@${{ secrets.PREPROD_SERVER_HOST }} "mkdir -p ${{ env.APP_DIR }}/nginx"
          scp -P ${{ secrets.PREPROD_SERVER_PORT || '22' }} ${{ env.COMPOSE_FILE }} ${{ secrets.PREPROD_SERVER_USER }}@${{ secrets.PREPROD_SERVER_HOST }}:${{ env.APP_DIR }}/
          scp -P ${{ secrets.PREPROD_SERVER_PORT || '22' }} nginx/nginx.conf ${{ secrets.PREPROD_SERVER_USER }}@${{ secrets.PREPROD_SERVER_HOST }}:${{ env.APP_DIR }}/nginx/

      - name: Write .env.preprod on server
        run: |
          ssh -p ${{ secrets.PREPROD_SERVER_PORT || '22' }} ${{ secrets.PREPROD_SERVER_USER }}@${{ secrets.PREPROD_SERVER_HOST }} "cat > ${{ env.APP_DIR }}/.env.preprod" << 'EOF'
          NODE_ENV=preprod
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          CORS_ORIGIN=${{ secrets.PREPROD_CORS_ORIGIN }}
          SERVER_BASE_URL=${{ secrets.PREPROD_SERVER_BASE_URL }}
          JWT_SECRET=${{ secrets.PREPROD_JWT_SECRET }}
          
          # Supabase PostgreSQL
          SUPABASE_HOST=${{ secrets.PREPROD_SUPABASE_HOST }}
          SUPABASE_PORT=${{ secrets.PREPROD_SUPABASE_PORT }}
          SUPABASE_USER=${{ secrets.PREPROD_SUPABASE_USER }}
          SUPABASE_PASSWORD=${{ secrets.PREPROD_SUPABASE_PASSWORD }}
          SUPABASE_DB=${{ secrets.PREPROD_SUPABASE_DB }}
          
          # MongoDB Atlas
          MONGODB_ATLAS_URI=${{ secrets.PREPROD_MONGODB_ATLAS_URI }}
          
          # Pinata IPFS
          PINATA_JWT=${{ secrets.PREPROD_PINATA_JWT }}
          PINATA_API_URL=https://api.pinata.cloud
          EOF

      - name: Pull images & restart services
        run: |
          ssh -p ${{ secrets.PREPROD_SERVER_PORT || '22' }} ${{ secrets.PREPROD_SERVER_USER }}@${{ secrets.PREPROD_SERVER_HOST }} << ENDSSH
          set -e
          cd ${{ env.APP_DIR }}
          
          echo "🔑 Authenticating server with Docker Hub..."
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          echo "📥 Pulling images..."
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file .env.preprod pull
          
          echo "🚀 Bringing services up..."
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file .env.preprod up -d --remove-orphans
          
          echo "🧹 Cleaning up dangling images..."
          docker image prune -f
          
          echo "✅ Deployment complete!"
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting 20 s for services to initialise..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.PREPROD_SERVER_HOST }}:8001/health || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (got $STATUS)"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Pre-prod deployment FAILED for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
